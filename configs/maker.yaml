# A MakerMods Maker Arm station: two Maker Arm v1 follower arms (RobStride motors),
# one Meta Quest, three cameras. Copy this file for your station, then replace every REPLACE and null value.
# docs/hardware_setup.md explains each one.

arm: maker
# task: "pick up the red cube and put it in the bowl"  # optional: a task text for every episode; --task overrides it
dataset_dir: ~/hackathon_data/my-task                # one LeRobot v2.1 dataset; each session adds to it
fps: 30                                              # recording rate
control_hz: 30                                       # teleop loop rate (a multiple of fps)
record_width: 640                                    # frames are center-cropped to 16:9 and resized to this
record_height: 360

arms:
  left:
    port: /dev/serial/by-id/REPLACE   # the arm's CAN adapter (slcan), or its interface (can0) with socketcan
    # Quest frame (x right, y up, z toward you) into the arm's base frame. The Maker URDF's base frame has -x
    # forward, +y up and +z to the arm's left; this is for an operator standing behind the arms and facing the way
    # they face. Check it with --dry-run (docs/hardware_setup.md, step 5).
    quest_to_base: [[0, 0, 1], [0, 1, 0], [-1, 0, 0]]
    workspace_min_m: [-0.60, -0.10, -0.60]  # the box the tool is kept inside, in the arm's base frame (y is up)
    workspace_max_m: [0.60, 0.60, 0.60]
    gripper_open_deg: -96.0     # dreamcli's Maker default; copy yours from the config dreamcli setup wrote
    gripper_closed_deg: -2.5    # as above
    # The tool center point: the point between the closed fingertips, in the flange's frame (link_007), metres.
    # Dream's own point for the stock MakerMods gripper, the one `dreamcli robot run` drives about. A different
    # gripper needs its own measured (docs/hardware_setup.md, "Tool center point"). Check it in a dry run either way.
    tcp_xyz_m: [0.0, 0.0, -0.1696387]  # Dream's tool point for the stock gripper (scripts/use_dream_tcp.py)
  right:
    port: /dev/serial/by-id/REPLACE
    quest_to_base: [[0, 0, 1], [0, 1, 0], [-1, 0, 0]]
    workspace_min_m: [-0.60, -0.10, -0.60]
    workspace_max_m: [0.60, 0.60, 0.60]
    gripper_open_deg: -96.0     # dreamcli's Maker default; copy yours from the config dreamcli setup wrote
    gripper_closed_deg: -2.5    # as above
    tcp_xyz_m: [0.0, 0.0, -0.1696387]  # Dream's tool point for the stock gripper (scripts/use_dream_tcp.py)

makermods:
  can_interface: slcan        # each arm follows its port: /dev/serial/... or /dev/ttyACM* is slcan, can0 socketcan
  urdf: ~/.cache/dream_hackathon/urdf/maker_arm.urdf  # scripts/fetch_urdf.py downloads it
  flange_link: link_007
  urdf_joints: [link_002_joint, link_003_joint, link_004_joint, link_005_joint, link_006_joint, link_007_joint]
  joint_signs: [1, 1, 1, 1, 1, 1]  # follower angle to URDF joint, makermodslab's mapping; confirm with --dry-run

teleop:
  max_joint_speed_rad_s: 1.5  # no joint target moves faster
  translation_scale: 1.0      # 0.5 moves the tool half as far as your hand
  joint_limit_margin_rad: 0.05

cameras:                      # exactly these three roles; type uvc (any webcam) or realsense
  overhead: {type: uvc, device: /dev/v4l/by-id/REPLACE, width: 1280, height: 720, fps: 30}
  wrist_l: {type: uvc, device: /dev/v4l/by-id/REPLACE, width: 1280, height: 720, fps: 30}
  wrist_r: {type: uvc, device: /dev/v4l/by-id/REPLACE, width: 1280, height: 720, fps: 30}
